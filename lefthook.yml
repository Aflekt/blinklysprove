pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    hemmeligheter:
      run: command -v gitleaks >/dev/null && gitleaks git --staged --no-banner --redact || echo "gitleaks mangler lokalt (brew install gitleaks), CI sjekker likevel"
